<h1 mat-dialog-title class="text-3xl text-center font-bold mb-6">Detalle de apuesta</h1>
<div mat-dialog-content>

    <div class="overflow-auto mat-elevation-z8 mt-5">
      <table mat-table [dataSource]="datasource" class="w-full">
        
        <ng-container matColumnDef="valorCompra">
          <th mat-header-cell *matHeaderCellDef>Valor Compra</th>
          <td mat-cell *matCellDef="let element">{{element.valorCompra}}</td>
        </ng-container>
        
        <ng-container matColumnDef="valorWebSocket">
          <th mat-header-cell *matHeaderCellDef>Valor en Mercado</th>
          <td mat-cell *matCellDef="let element">{{element.valorWebSocket}}</td>
        </ng-container>
        
        <ng-container matColumnDef="ganPer">
          <th mat-header-cell *matHeaderCellDef>Ganancia/Pérdida</th>
          <td mat-cell *matCellDef="let element">{{element.ganPer}}</td>
        </ng-container>
        
        <ng-container matColumnDef="montoGanPer">
          <th mat-header-cell *matHeaderCellDef>Monto Ganancia/Pérdida</th>
          <td mat-cell *matCellDef="let element">{{element.montoGanPer | currency:'USD'}}</td>
        </ng-container>
        
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        
      </table>
    </div>

</div>
