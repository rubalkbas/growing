 
<h1 mat-dialog-title class="text-2xl text-center font-bold">Cliente</h1>
<div class="form-group">
  <label for="nocliente">NOMBRE CLIENTE: <b>{{ data.data.usuario }}</b></label>
</div>
<div mat-dialog-content class="p-4">
  <div class="mx-auto p-6 bg-white shadow-lg rounded-lg max-w-md">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

      <div class="mb-6">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Valor Unidad</mat-label>
          <input matInput placeholder="Ingresa tu valor de unidad" formControlName="valorUnidad">
 
        </mat-form-field>
      </div>

      <div class="mb-6">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Unidades</mat-label>
          <input matInput placeholder="Ingresa tus unidades" formControlName="unidades">
 
        </mat-form-field>
      </div>
      <button mat-raised-button color="primary" type="submit" [disabled]="userForm.invalid" class="w-full">Enviar</button>
    </form>
  </div>
</div>
