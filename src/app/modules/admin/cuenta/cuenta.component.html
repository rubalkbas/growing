<div class="grid grid-cols-1 xl:grid-cols-3 gap-8 w-full">
    <!-- Asegúrate de que el grid ocupe toda la altura -->
    <div class="mt-5 xl:col-span-3 flex flex-col flex-auto bg-card shadow rounded-2xl overflow-hidden">
        <div class="container p-6">
            <div class="flex space-x-4 mb-6">
                <div class="flex-1 flex">
                    <div
                        class="relative flex flex-col flex-auto p-6 pr-3 pb-3 bg-card rounded-2xl shadow overflow-hidden h-full">
                        <div class="absolute bottom-0 right-0 w-27 h-27 -m-6">
                            <mat-icon class="icon-size-24 opacity-25 text-green-500 dark:text-green-400"
                                [svgIcon]="'heroicons_outline:currency-dollar'"></mat-icon>
                        </div>
                        <div class="flex items-center">
                            <div class="flex flex-col">
                                <div class="text-xl font-medium tracking-tight leading-6 truncate">CREDITO</div>
                                <div class="text-green-600 font-medium text-sm">
                                    USD
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-row flex-wrap mt-4 -mx-6">
                            <div class="flex flex-col mx-6 my-3">
                                <div class="mt-2 font-medium text-5xl leading-none">{{ totalCreditos |
                                    currency:'USD'}}</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex-1 flex">
                    <div
                        class="relative flex flex-col flex-auto p-6 pr-3 pb-3 bg-card rounded-2xl shadow overflow-hidden h-full">
                        <div class="absolute bottom-0 right-0 w-27 h-27 -m-6">
                            <mat-icon class="icon-size-24 opacity-25 text-green-500 dark:text-green-400"
                                [svgIcon]="'heroicons_outline:currency-dollar'"></mat-icon>
                        </div>
                        <div class="flex items-center">
                            <div class="flex flex-col">
                                <div class="text-xl font-medium tracking-tight leading-6 truncate">GAN/PER
                                </div>
                                <div class="text-green-600 font-medium text-sm">
                                    USD
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-row flex-wrap mt-4 -mx-6">
                            <div class="flex flex-col mx-6 my-3">
                                <div class="mt-2 font-medium text-5xl leading-none">{{ totalGanPerd |
                                    currency:'USD'}}</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex-1 flex">
                    <div
                        class="relative flex flex-col flex-auto p-6 pr-3 pb-3 bg-card rounded-2xl shadow overflow-hidden h-full">
                        <div class="absolute bottom-0 right-0 w-27 h-27 -m-6">
                            <mat-icon class="icon-size-24 opacity-25 text-green-500 dark:text-green-400"
                                [svgIcon]="'heroicons_outline:currency-dollar'"></mat-icon>
                        </div>
                        <div class="flex items-center">
                            <div class="flex flex-col">
                                <div class="text-xl font-medium tracking-tight leading-6 truncate">Retiros Solicitados</div>
                                <div class="text-green-600 font-medium text-sm">
                                    USD
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-row flex-wrap mt-4 -mx-6">
                            <div class="flex flex-col mx-6 my-3">
                                <!-- <div class="text-sm font-medium leading-none text-secondary">Card Limit</div> -->
                                <div class="mt-2 font-medium text-5xl leading-none">{{ totalRetirosSolicitados | currency:'USD'}}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex-1 flex">
                    <div
                        class="relative flex flex-col flex-auto p-6 pr-3 pb-3 bg-card rounded-2xl shadow overflow-hidden h-full">
                        <div class="absolute bottom-0 right-0 w-27 h-27 -m-6">
                            <mat-icon class="icon-size-24 opacity-25 text-green-500 dark:text-green-400"
                                [svgIcon]="'heroicons_outline:currency-dollar'"></mat-icon>
                        </div>
                        <div class="flex items-center">
                            <div class="flex flex-col">
                                <div class="text-xl font-medium tracking-tight leading-6 truncate">Retiros Efectuados</div>
                                <div class="text-green-600 font-medium text-sm">
                                    USD
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-row flex-wrap mt-4 -mx-6">
                            <div class="flex flex-col mx-6 my-3">
                                <!-- <div class="text-sm font-medium leading-none text-secondary">Card Limit</div> -->
                                <div class="mt-2 font-medium text-5xl leading-none">{{ totalRetirosEfectuados | currency:'USD'}}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex justify-center mt-6">
                <button mat-fab extended  (click)="consultaAbiertas()">
                    <mat-icon>monetization_on</mat-icon>
                    Solicitar Retiro
                </button>
            </div>

        </div>
    </div>
</div>
